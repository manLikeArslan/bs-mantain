<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillingSourcebook — We'll Be Back Soon</title>
<meta name="description" content="BillingSourcebook is temporarily down for maintenance. We'll be back soon.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #0f172a;
    margin-bottom: 8px;
  }
  .logo span { color: #0d9488; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0d9488;
    background: #f0fdfa;
    border: 1px solid #ccfbf1;
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #475569;
    margin-bottom: 12px;
  }
  p:last-child { margin-bottom: 0; }
  .note {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Billing<span>Sourcebook</span></div>
    <div class="badge">Maintenance</div>
    <h1>We'll be back soon.</h1>
    <p>BillingSourcebook is temporarily down while we make the site faster, more secure, and more reliable.</p>
    <p>All 3,060 company listings, guides, and tools will be back shortly.</p>
    <p class="note">Thank you for your patience.</p>
  </div>
</body>
</html>
